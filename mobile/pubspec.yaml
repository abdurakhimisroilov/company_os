name: company_os
description: Company OS - Enterprise Business Management App
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.3
  web_socket_channel: ^2.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^12.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Charts
  fl_chart: ^0.65.0

  # Images
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  flutter_svg: ^2.0.9

  # Files
  file_picker: ^6.1.1
  path_provider: ^2.1.1

  # PDF & Excel
  pdf: ^3.10.7
  excel: ^4.0.2

  # UI
  shimmer: ^3.0.0
  lottie: ^2.7.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  badges: ^3.1.2
  flutter_screenutil: ^5.9.0

  # Internationalization
  intl: ^0.20.3

  # Permissions
  permission_handler: ^11.1.0

  # DI
  get_it: ^7.6.4

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  local_auth: ^3.0.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

dependency_overrides:
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
